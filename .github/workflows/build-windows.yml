name: build-windows

# Windows 安装包必须在 Windows 上构建：后端是 PyInstaller 单文件 exe，
# 不能从 macOS 交叉编译。这里用 GitHub 的 Windows runner 出包。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: 安装前端依赖
        run: npm ci

      - name: 打包后端为单文件 exe
        run: npm run build:python

      - name: 生成 Windows 安装包
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验产物
        run: |
          Get-ChildItem release | Format-Table Name,Length
          if (-not (Test-Path dist-python/server.exe)) { throw "缺少 dist-python/server.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
