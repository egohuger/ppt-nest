<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http://127.0.0.1:*; img-src 'self' data: http://127.0.0.1:* blob:; connect-src http://127.0.0.1:*;">
    <title>PPT Nest - 片巢</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Primary Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <img src="icon.png" alt="PPT Nest" width="28" height="28">
                </div>
                <span class="brand-text">PPT Nest</span>
                <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" data-tip="折叠侧边栏" aria-label="折叠侧边栏">
                    <span data-icon="chevron-left" data-size="16"></span>
                </button>
            </div>

            <button class="sidebar-expand-btn" id="sidebar-expand-btn" data-tip="展开侧边栏" aria-label="展开侧边栏">
                <span data-icon="chevron-right" data-size="18"></span>
            </button>

            <div class="nav-section">
                <div class="nav-label">导航</div>
                <a class="nav-item active" data-page="browse" href="#">
                    <span data-icon="layout-grid" data-size="18"></span>
                    <span>分类浏览</span>
                    <span class="nav-chevron-toggle" id="browse-chevron" data-tip="展开/折叠右侧面板" role="button" aria-label="展开或折叠右侧面板">
                        <span data-icon="chevron-right" data-size="14"></span>
                    </span>
                </a>
                <a class="nav-item" data-page="files" href="#">
                    <span data-icon="folder" data-size="18"></span>
                    <span>文件浏览</span>
                    <span class="nav-chevron-toggle" id="files-chevron" data-tip="展开/折叠右侧面板" role="button" aria-label="展开或折叠右侧面板">
                        <span data-icon="chevron-right" data-size="14"></span>
                    </span>
                </a>
                <a class="nav-item" data-page="scan" href="#">
                    <span data-icon="scan-line" data-size="18"></span>
                    <span>素材入库</span>
                </a>
                <a class="nav-item" data-page="dedup" href="#">
                    <span data-icon="copy" data-size="18"></span>
                    <span>重复检测</span>
                </a>
                <a class="nav-item" data-page="compose" href="#">
                    <span data-icon="layers" data-size="18"></span>
                    <span>组稿导出</span>
                </a>
                <a class="nav-item" data-page="categories" href="#">
                    <span data-icon="folder-tree" data-size="18"></span>
                    <span>类别管理</span>
                </a>
                <a class="nav-item" data-page="settings" href="#">
                    <span data-icon="sliders-horizontal" data-size="18"></span>
                    <span>设置</span>
                </a>
                <div class="nav-label nav-label-soon">即将上线</div>
                <a class="nav-item nav-locked" data-feature="aigc" href="#" data-tip="功能开发中，即将上线">
                    <span data-icon="sparkles" data-size="18"></span>
                    <span>AI 智能组稿</span>
                </a>
                <a class="nav-item nav-locked" data-feature="similar" href="#" data-tip="功能开发中，即将上线">
                    <span data-icon="copy" data-size="18"></span>
                    <span>相似页推荐</span>
                </a>
                <a class="nav-item nav-locked" data-feature="backup" href="#" data-tip="功能开发中，即将上线">
                    <span data-icon="archive" data-size="18"></span>
                    <span>备份与还原</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="stats-bar" id="sidebar-stats">
                    <span class="stat-dot"></span>
                    <span>加载中...</span>
                </div>
            </div>
        </nav>

        <!-- Secondary Sidebar (category panel for browse page) -->
        <aside id="sub-sidebar">
            <div class="sub-sidebar-header">
                <span class="sub-sidebar-title" id="sub-sidebar-title">分类浏览</span>
            </div>
            <div class="sub-nav-section" id="sub-categories">
                <div class="loading-spinner sub-loading"><div class="spinner"></div></div>
            </div>
            <div class="sub-sidebar-footer">
                <span id="sub-slide-count">-- 个页面</span>
            </div>
        </aside>

        <!-- Resize Handle (between sub-sidebar and content) -->
        <div class="sub-sidebar-resize-handle" id="sub-sidebar-resize-handle"></div>

        <!-- Main Content -->
        <main id="content">
            <div id="page-container">
                <div class="loading-spinner" id="loading">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal-box" id="modal-box"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/icons.js"></script>
    <script src="js/tooltip.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/context-menu.js"></script>
    <script src="js/components/paginator.js"></script>
    <script src="js/components/slidecard.js"></script>
    <script src="js/pages/onboarding.js"></script>
    <script src="js/pages/browse.js"></script>
    <script src="js/pages/files.js"></script>
    <script src="js/pages/scan.js"></script>
    <script src="js/pages/dedup.js"></script>
    <script src="js/pages/compose.js"></script>
    <script src="js/pages/categories.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
