<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http://127.0.0.1:*; img-src 'self' data: http://127.0.0.1:* blob:; connect-src http://127.0.0.1:*;">
    <title>PPT Nest - 片巢</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Primary Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <img src="icon.png" alt="PPT Nest" width="28" height="28">
                </div>
                <span class="brand-text">PPT Nest</span>
                <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="折叠侧边栏">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
            </div>

            <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="展开侧边栏">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>

            <div class="nav-section">
                <div class="nav-label">导航</div>
                <a class="nav-item active" data-page="browse" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                    </svg>
                    <span>分类浏览</span>
                    <span class="nav-chevron-toggle" id="browse-chevron" title="展开/折叠侧面板">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </span>
                </a>
                <a class="nav-item" data-page="files" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>文件浏览</span>
                    <span class="nav-chevron-toggle" id="files-chevron" title="展开/折叠文件面板">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </span>
                </a>
                <a class="nav-item" data-page="search" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>搜索</span>
                </a>
                <a class="nav-item" data-page="scan" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-9-9"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <span>扫描处理</span>
                </a>
                <a class="nav-item" data-page="dedup" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="8" width="8" height="12" rx="1"/><rect x="14" y="4" width="8" height="16" rx="1"/>
                    </svg>
                    <span>重复检测</span>
                </a>
                <a class="nav-item" data-page="categories" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>类别管理</span>
                </a>
                <a class="nav-item" data-page="settings" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <span>设置</span>
                </a>
                <div class="nav-label nav-label-soon">即将上线</div>
                <a class="nav-item nav-locked" data-feature="aigc" href="#" title="即将上线">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7 5.7 1.9-5.7 1.9L12 18.2l-1.9-5.7-5.7-1.9 5.7-1.9z"/></svg>
                    <span>AI 智能组稿</span>
                </a>
                <a class="nav-item nav-locked" data-feature="export" href="#" title="即将上线">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>导出成 PPT</span>
                </a>
                <a class="nav-item nav-locked" data-feature="similar" href="#" title="即将上线">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span>相似页推荐</span>
                </a>
                <a class="nav-item nav-locked" data-feature="backup" href="#" title="即将上线">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                    <span>备份与还原</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="stats-bar" id="sidebar-stats">
                    <span class="stat-dot"></span>
                    <span>加载中...</span>
                </div>
            </div>
        </nav>

        <!-- Secondary Sidebar (category panel for browse page) -->
        <aside id="sub-sidebar">
            <div class="sub-sidebar-header">
                <span class="sub-sidebar-title" id="sub-sidebar-title">分类浏览</span>
            </div>
            <div class="sub-nav-section" id="sub-categories">
                <div class="loading-spinner sub-loading"><div class="spinner"></div></div>
            </div>
            <div class="sub-sidebar-footer">
                <span id="sub-slide-count">-- 个页面</span>
            </div>
        </aside>

        <!-- Resize Handle (between sub-sidebar and content) -->
        <div class="sub-sidebar-resize-handle" id="sub-sidebar-resize-handle"></div>

        <!-- Main Content -->
        <main id="content">
            <div id="page-container">
                <div class="loading-spinner" id="loading">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal-box" id="modal-box"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/paginator.js"></script>
    <script src="js/components/slidecard.js"></script>
    <script src="js/pages/onboarding.js"></script>
    <script src="js/pages/browse.js"></script>
    <script src="js/pages/files.js"></script>
    <script src="js/pages/search.js"></script>
    <script src="js/pages/scan.js"></script>
    <script src="js/pages/dedup.js"></script>
    <script src="js/pages/categories.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
